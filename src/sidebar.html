<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <style>
    body {
      font-family: Arial, sans-serif;
      font-size: 13px;
      padding: 12px;
      color: #202124;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 8px;
    }
    h2 {
      font-size: 14px;
      margin: 18px 0 8px;
    }
    label {
      display: block;
      margin: 8px 0 3px;
      font-weight: 600;
    }
    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 6px;
      border: 1px solid #dadce0;
      border-radius: 4px;
      font-size: 13px;
    }
    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    .check {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
    }
    .check input {
      width: auto;
    }
    button {
      width: 100%;
      padding: 8px;
      border: 0;
      border-radius: 4px;
      cursor: pointer;
      margin-top: 10px;
      font-weight: 600;
    }
    .primary { background: #1a73e8; color: white; }
    .secondary { background: #e8f0fe; color: #174ea6; }
    .danger { background: #fce8e6; color: #a50e0e; }
    .box {
      border: 1px solid #dadce0;
      border-radius: 6px;
      padding: 10px;
      margin-top: 10px;
      background: #fff;
    }
    .muted { color: #5f6368; font-size: 12px; }
    #status {
      margin-top: 12px;
      padding: 8px;
      background: #f8fafd;
      border: 1px solid #dadce0;
      border-radius: 4px;
      white-space: pre-wrap;
    }
  </style>
</head>
<body>
  <h1>verract</h1>
  <div class="muted">Verify → Resolve → Action</div>

  <div class="box">
    <h2>Range</h2>
    <label>Sheet name</label>
    <input id="sheetName" placeholder="blank = active sheet">
    <div class="row">
      <div>
        <label>Start row</label>
        <input id="startRow" type="number" value="2">
      </div>
      <div>
        <label>End row</label>
        <input id="endRow" type="number" value="2">
      </div>
    </div>
    <label>Row ranges</label>
    <input id="rowRanges" placeholder="optional, e.g. 10:15,20:25">
    <label>Batch size</label>
    <input id="batchSize" type="number" value="20">
    <button class="secondary" onclick="loadSelection()">Use active selection</button>
  </div>

  <div class="box">
    <h2>Input</h2>
    <label>RootID column</label>
    <input class="column-input" id="rootIdColumn" placeholder="Example: A">
    <label>Candidate Path Columns</label>
    <input class="column-input" id="pathColumns" placeholder="Example: AT:AW or C,E:G">
    <label>Filename column</label>
    <input class="column-input" id="filenameColumn" placeholder="Example: B">
    <label>Extension column</label>
    <input class="column-input" id="extensionColumn" placeholder="optional">
    <div class="check">
      <input id="skipExistingTrue" type="checkbox">
      <span>Skip rows with Exists=TRUE</span>
    </div>
  </div>

  <div class="box">
    <h2>Action Input</h2>
    <label>Target Path column *</label>
    <input class="column-input" id="targetPathColumn" placeholder="Example: AW">
    <label>Operation *</label>
    <select id="operation">
      <option value="MOVE">MOVE</option>
    </select>
  </div>

  <div class="box">
    <h2>Verify Report</h2>
    <label>Exists *</label>
    <input class="column-input" id="verify_Exists" placeholder="Example: AX">
    <label>CheckedPathCount</label>
    <input class="column-input" id="verify_CheckedPathCount">
    <label>MatchedPathColumn</label>
    <input class="column-input" id="verify_MatchedPathColumn">
    <label>Error</label>
    <input class="column-input" id="verify_Error">
  </div>

  <div class="box">
    <h2>Resolve Report</h2>
    <label>ResolveStatus *</label>
    <input class="column-input" id="resolve_ResolveStatus" placeholder="Example: BA">
    <label>ResolveID</label>
    <input class="column-input" id="resolve_ResolveID">
    <label>ResolveCandidateCount</label>
    <input class="column-input" id="resolve_ResolveCandidateCount">
    <label>ResolveNote</label>
    <input class="column-input" id="resolve_ResolveNote">
  </div>

  <div class="box">
    <h2>Shared Output</h2>
    <label>SharedPathID *</label>
    <input class="column-input" id="shared_SharedPathID">
    <label>SharedFileID *</label>
    <input class="column-input" id="shared_SharedFileID">
    <label>SharedPath *</label>
    <input class="column-input" id="shared_SharedPath">
    <label>SharedFilename *</label>
    <input class="column-input" id="shared_SharedFilename">
    <label>SharedSource *</label>
    <input class="column-input" id="shared_SharedSource">
  </div>

  <div class="box">
    <h2>Action Output</h2>
    <label>ActionStatus *</label>
    <input class="column-input" id="action_ActionStatus">
    <label>ActionID *</label>
    <input class="column-input" id="action_ActionID">
    <label>ActionAt *</label>
    <input class="column-input" id="action_ActionAt">
    <label>ActionNote</label>
    <input class="column-input" id="action_ActionNote">
  </div>

  <button class="primary" onclick="runVerify()">Run Verify</button>
  <button class="primary" onclick="runResolve()">Run Resolve</button>
  <button class="primary" onclick="runAction()">Run Action</button>
  <button class="danger" onclick="stopRun()">Stop & Reset</button>

  <div id="status">Ready.</div>

  <script>
    function val(id) {
      var element = document.getElementById(id);
      var value = element.value.trim();
      return element.classList.contains('column-input')
        ? value.toUpperCase()
        : value;
    }

    function setVal(id, value) {
      document.getElementById(id).value = value || '';
    }

    function status(message) {
      document.getElementById('status').textContent = message;
    }

    function buildConfig() {
      return {
        sheetName: val('sheetName'),
        startRow: Number(val('startRow')),
        endRow: Number(val('endRow')),
        rowRanges: val('rowRanges'),
        batchSize: Number(val('batchSize')),
        rootIdColumn: val('rootIdColumn'),
        pathColumns: val('pathColumns'),
        filenameColumn: val('filenameColumn'),
        extensionColumn: val('extensionColumn'),
        targetPathColumn: val('targetPathColumn'),
        operation: val('operation'),
        skipExistingTrue: document.getElementById('skipExistingTrue').checked,
        verifyMapping: {
          Exists: val('verify_Exists'),
          CheckedPathCount: val('verify_CheckedPathCount'),
          MatchedPathColumn: val('verify_MatchedPathColumn'),
          Error: val('verify_Error')
        },
        resolveMapping: {
          ResolveStatus: val('resolve_ResolveStatus'),
          ResolveID: val('resolve_ResolveID'),
          ResolveCandidateCount: val('resolve_ResolveCandidateCount'),
          ResolveNote: val('resolve_ResolveNote')
        },
        sharedMapping: {
          SharedPathID: val('shared_SharedPathID'),
          SharedFileID: val('shared_SharedFileID'),
          SharedPath: val('shared_SharedPath'),
          SharedFilename: val('shared_SharedFilename'),
          SharedSource: val('shared_SharedSource')
        },
        actionMapping: {
          ActionStatus: val('action_ActionStatus'),
          ActionID: val('action_ActionID'),
          ActionAt: val('action_ActionAt'),
          ActionNote: val('action_ActionNote')
        }
      };
    }

    function loadSelection() {
      status('Reading active selection...');
      google.script.run
        .withSuccessHandler(function(selection) {
          setVal('sheetName', selection.sheetName);
          setVal('startRow', selection.startRow);
          setVal('endRow', selection.endRow);
          setVal('rowRanges', selection.rowRanges || '');
          status('Selection loaded: ' + selection.a1Notation);
        })
        .withFailureHandler(function(err) {
          status('ERROR: ' + err.message);
        })
        .GET_VERRACT_ACTIVE_SELECTION();
    }

    function applySavedSettings(settings) {
      if (!settings) return;

      [
        'sheetName', 'startRow', 'endRow', 'rowRanges', 'batchSize',
        'rootIdColumn', 'pathColumns', 'filenameColumn', 'extensionColumn',
        'targetPathColumn', 'operation'
      ].forEach(function(id) {
        if (settings[id] !== undefined && settings[id] !== null) {
          setVal(id, settings[id]);
        }
      });

      if (settings.skipExistingTrue !== undefined) {
        document.getElementById('skipExistingTrue').checked =
          !!settings.skipExistingTrue;
      }

      var verify = settings.verifyMapping || {};
      var resolve = settings.resolveMapping || {};
      var shared = settings.sharedMapping || {};
      var action = settings.actionMapping || {};
      Object.keys(verify).forEach(function(key) { setVal('verify_' + key, verify[key]); });
      Object.keys(resolve).forEach(function(key) { setVal('resolve_' + key, resolve[key]); });
      Object.keys(shared).forEach(function(key) { setVal('shared_' + key, shared[key]); });
      Object.keys(action).forEach(function(key) { setVal('action_' + key, action[key]); });
    }

    function loadSavedSettings() {
      google.script.run
        .withSuccessHandler(applySavedSettings)
        .GET_VERRACT_SAVED_UI_SETTINGS();
    }

    function loadMappings() {
      google.script.run
        .withSuccessHandler(function(settings) {
          if (!settings) return;
          var verify = settings.verifyMapping || {};
          var resolve = settings.resolveMapping || {};
          var shared = settings.sharedMapping || {};
          var action = settings.actionMapping || {};
          Object.keys(verify).forEach(function(key) { setVal('verify_' + key, verify[key]); });
          Object.keys(resolve).forEach(function(key) { setVal('resolve_' + key, resolve[key]); });
          Object.keys(shared).forEach(function(key) { setVal('shared_' + key, shared[key]); });
          Object.keys(action).forEach(function(key) { setVal('action_' + key, action[key]); });
        })
        .GET_VERRACT_OUTPUT_MAPPING_SETTINGS();
    }

    function formatRunResult(result) {
      if (!result) return 'No response.';
      if (result.ok) {
        return result.phase + ' completed: rows ' + result.startRow + '–' + result.endRow + '.';
      }
      return result.message || result.status || 'Run failed.';
    }

    function runVerify() {
      status('Running Verify...');
      google.script.run
        .withSuccessHandler(function(result) {
          status(formatRunResult(result));
        })
        .withFailureHandler(function(err) {
          status('ERROR: ' + err.message);
        })
        .START_VERIFY_FROM_SIDEBAR(buildConfig());
    }

    function runResolve() {
      status('Running Resolve...');
      google.script.run
        .withSuccessHandler(function(result) {
          status(formatRunResult(result));
        })
        .withFailureHandler(function(err) {
          status('ERROR: ' + err.message);
        })
        .START_RESOLVE_FROM_SIDEBAR(buildConfig());
    }


    function runAction() {
      status('Running Action...');
      google.script.run
        .withSuccessHandler(function(result) {
          status(formatRunResult(result));
        })
        .withFailureHandler(function(err) {
          status('ERROR: ' + err.message);
        })
        .START_ACTION_FROM_UI(buildConfig());
    }

    function stopRun() {
      status('Stopping...');
      google.script.run
        .withSuccessHandler(function(result) {
          status(JSON.stringify(result, null, 2));
        })
        .withFailureHandler(function(err) {
          status('ERROR: ' + err.message);
        })
        .STOP_VERRACT_FROM_SIDEBAR();
    }

    document.querySelectorAll('.column-input').forEach(function(input) {
      input.addEventListener('input', function() {
        var start = this.selectionStart;
        var end = this.selectionEnd;
        this.value = this.value.toUpperCase();
        if (this.setSelectionRange) this.setSelectionRange(start, end);
      });
    });

    loadSavedSettings();
    loadMappings();
  </script>
</body>
</html>
